name: Manuscript code and output audit

on:
  push:
    branches: [main]
  workflow_dispatch:

permissions:
  contents: read

jobs:
  publication:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: '3.13'
      - name: Check Python syntax
        run: python -m py_compile analysis/run-code/*.py analysis/verify_models.py scripts/*.py
      - name: Validate sources and results
        run: python scripts/audit_publication.py
